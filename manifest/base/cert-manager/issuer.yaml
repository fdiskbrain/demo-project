# ClusterIssuer for Let's Encrypt Production (ACME)
# This issuer will be used to request production certificates
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    # Add annotation to prevent issues with ACME challenges
    cert-manager.io/allow-direct-injection: "true"
spec:
  acme:
    # Let's Encrypt production server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    
    # Email address for notifications about certificate expiry
    email: admin@example.com
    
    # Secret to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    
    # Challenge solver configuration
    solvers:
    - http01:
        ingress:
          # Use nginx ingress class for HTTP-01 challenges
          class: nginx
          
          # Optional: Configure ingress template for challenges
          ingressTemplate:
            metadata:
              annotations:
                nginx.ingress.kubernetes.io/ssl-redirect: "false"

---
# ClusterIssuer for Let's Encrypt Staging (for testing)
# Use this for testing to avoid rate limits
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    cert-manager.io/allow-direct-injection: "true"
spec:
  acme:
    # Let's Encrypt staging server URL (not trusted by browsers)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    
    # Email address for notifications
    email: admin@example.com
    
    # Secret to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    
    # Challenge solver configuration
    solvers:
    - http01:
        ingress:
          class: nginx
          ingressTemplate:
            metadata:
              annotations:
                nginx.ingress.kubernetes.io/ssl-redirect: "false"
