name: 'Terraform PR Validation'

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'tf/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: '1.15.3'
  AWS_REGION: 'us-east-1'
  TF_WORKING_DIR: 'tf'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 'Terraform Format Check'
        id: fmt
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: 'Terraform Init'
        id: init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: 'Terraform Validate'
        id: validate
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform validate -no-color

      - name: 'Security Scan with tfsec'
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: true

      - name: 'Upload Security Scan Results'
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.TF_WORKING_DIR }}/tfsec-results.sarif
        continue-on-error: true

      - name: 'Comment PR - Format Issues'
        if: steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` to fix formatting issues.'
            })

      - name: 'Comment PR - Validation Summary'
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.validate.outcome }}';
            const status = outcome === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Terraform Validation**: ${outcome}`
            })

  terraform-plan-dev:
    env:
      ENVIRONMENT: dev
    name: 'Terraform Plan - Dev'
    needs: terraform-validate
    runs-on: ubuntu-latest
    # Note: Configure 'dev' environment in GitHub repo settings if environment protection is needed

    steps: &tfplan-steps
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 'Configure AWS Credentials ${{ env.ENVIRONMENT }}'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          ## TODO: Setup AWS Role OIDC
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Terraform Init'
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -input=false

      - name: 'Terraform Plan ${{ env.ENVIRONMENT }}'
        id: plan
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform plan -input=false -var-file="envs/terraform_${{ env.ENVIRONMENT }}.tfvars" -out=tfplan-${{ env.ENVIRONMENT}} -no-color  | tee plan-output.txt

      - name: 'Upload Plan Artifact'
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: ${{ env.TF_WORKING_DIR }}/tfplan-${{ env.ENVIRONMENT }}
          retention-days: 5

      - name: 'Comment PR with Plan'
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan-output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan - ${{ env.ENVIRONMENT }}  Environment\n\n\`\`\`\n${planOutput}\n\`\`\``

            })

  terraform-plan-staging:
    env:
      ENVIRONMENT: staging
    name: 'Terraform Plan - Staging'
    needs: terraform-validate
    runs-on: ubuntu-latest
    # Note: Configure 'staging' environment in GitHub repo settings if environment protection is needed

    steps: *tfplan-steps

  terraform-plan-test:
    env:
      ENVIRONMENT: test
    name: 'Terraform Plan - Test'
    needs: terraform-validate
    runs-on: ubuntu-latest
    # Note: Configure 'test' environment in GitHub repo settings if environment protection is needed

    steps: *tfplan-steps

  terraform-plan-perf:
    env:
      ENVIRONMENT: perf
    name: 'Terraform Plan - perf'
    needs: terraform-validate
    runs-on: ubuntu-latest
    # Note: Configure 'perf' environment in GitHub repo settings if environment protection is needed

    steps: *tfplan-steps

  terraform-plan-prod:
    env:
      ENVIRONMENT: prod
    name: 'Terraform Plan - Prod'
    needs: terraform-validate
    runs-on: ubuntu-latest
    # Note: Configure 'prod' environment in GitHub repo settings if environment protection is needed

    steps: *tfplan-steps
