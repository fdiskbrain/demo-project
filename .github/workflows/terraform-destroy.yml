name: 'Terraform Destroy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - test
          - staging
          - perf
          - prod
      confirm_destroy:
        description: 'Type "destroy" to confirm (case-sensitive)'
        required: true
        type: string

env:
  TF_VERSION: '1.15.3'
  AWS_REGION: 'us-east-1'
  TF_WORKING_DIR: 'tf'

permissions:
  contents: read
  id-token: write

jobs:
  validate-confirmation:
    name: 'Validate Destruction Confirmation'
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Verify Confirmation Input'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "❌ Invalid confirmation. Please type exactly 'destroy' (lowercase)"
            exit 1
          fi
          
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "⚠️ WARNING: You are about to destroy PRODUCTION infrastructure!"
            echo "This action is irreversible and will cause service outage."
          fi

  terraform-destroy:
    name: 'Terraform Destroy - ${{ github.event.inputs.environment }}'
    needs: validate-confirmation
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}-destroy
      url: https://console.aws.amazon.com/vpc/home?region=${{ env.AWS_REGION }}
    
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 'Configure AWS Credentials via OIDC'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', github.event.inputs.environment == 'dev' && 'DEV' || github.event.inputs.environment == 'test' && 'TEST' || github.event.inputs.environment == 'staging' && 'STAGING' || github.event.inputs.environment == 'perf' && 'PERF' || 'PROD')] }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: 'Set Variable File'
        id: set-varfile
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev) echo "var-file=terraform_dev.tfvars" >> $GITHUB_OUTPUT ;;
            test) echo "var-file=terraform_test.tfvars" >> $GITHUB_OUTPUT ;;
            staging) echo "var-file=terraform_staging.tfvars" >> $GITHUB_OUTPUT ;;
            perf) echo "var-file=terraform_perf.tfvars" >> $GITHUB_OUTPUT ;;
            prod) echo "var-file=terraform_prod.tfvars" >> $GITHUB_OUTPUT ;;
          esac

      - name: 'Terraform Init'
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -input=false

      - name: 'Terraform Plan - Destroy'
        id: plan-destroy
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform plan -destroy -input=false \
            -var-file="envs/${{ steps.set-varfile.outputs.var-file }}" \
            -out=tfplan-destroy \
            -no-color | tee destroy-plan.txt
        continue-on-error: false

      - name: 'Upload Destroy Plan'
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/destroy-plan.txt
          retention-days: 90

      - name: 'Terraform Destroy'
        id: destroy
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform apply -input=false -auto-approve tfplan-destroy
        timeout-minutes: 60

      - name: 'Post-Destruction Verification'
        if: steps.destroy.outcome == 'success'
        run: |
          echo "✅ Infrastructure destruction completed successfully"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

      - name: 'Notify Destruction Result'
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const environment = '${{ github.event.inputs.environment }}';
            const state = status === 'success' ? 'success' : 'failure';
            const description = status === 'success' 
              ? `Infrastructure destroyed: ${environment}`
              : `Destruction failed: ${environment}`;
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: `Terraform Destroy - ${environment}`,
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: 'Slack Notification'
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "⚠️ Terraform Destruction Alert",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform DESTROY - ${{ github.event.inputs.environment }}*\nStatus: ${{ job.status }}\nRepository: ${{ github.repository }}\nTriggered by: ${{ github.actor }}\nTimestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *This action is IRREVERSIBLE*"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
